# =============================================================================
# fnox.toml - Secret management for E-Phuxpoangshaefte
# =============================================================================
# Usage:
#   fnox set SECRET "my-jwt-secret"         # Set a secret
#   fnox list                                # List all secrets
#   fnox get SECRET                          # Get a secret value
#   fnox exec -- yarn --cwd back dev        # Run command with secrets loaded
#
# Secrets are encrypted with age using your SSH key and safe to commit to git.
# See back/.env.template for descriptions of each variable.

[providers]
age = { type = "age", recipients = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJG2uTlRRL+I2jeTCH90nry/M3yXR4eL7DOTc5DoaRVD"] }

[secrets]
# JWT secret used for authentication
SECRET= { provider = "age", value = "", description = "JWT secret for token signing" }

# Production database credentials
DB_NAME= { provider = "age", value = "", description = "Production database name" }
DB_USER= { provider = "age", value = "", description = "Production database user" }
DB_PASSWORD= { provider = "age", value = "", description = "Production database password" }
DB_HOST= { provider = "age", value = "", description = "Production database host" }

# SMTP configuration for password reset emails
SMTP_HOST= { provider = "age", value = "", description = "SMTP server hostname" }
SMTP_PORT= { provider = "age", value = "", description = "SMTP server port" }
SMTP_USER= { provider = "age", value = "", description = "SMTP username" }
SMTP_PW= { provider = "age", value = "", description = "SMTP password" }
MAIL_FROM= { provider = "age", value = "", description = "Sender address for password reset emails" }

# -- Profiles -----------------------------------------------------------------

[profiles.production.providers]
age = { type = "age", recipients = ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJG2uTlRRL+I2jeTCH90nry/M3yXR4eL7DOTc5DoaRVD"] }

[profiles.production.secrets]
SECRET = { provider = "age", description = "Production JWT secret" }
DB_NAME = { provider = "age", description = "Production database name" }
DB_USER = { provider = "age", description = "Production database user" }
DB_PASSWORD = { provider = "age", description = "Production database password" }
DB_HOST = { provider = "age", description = "Production database host" }
SMTP_HOST = { provider = "age", description = "Production SMTP host" }
SMTP_PORT = { provider = "age", description = "Production SMTP port" }
SMTP_USER = { provider = "age", description = "Production SMTP user" }
SMTP_PW = { provider = "age", description = "Production SMTP password" }
MAIL_FROM = { provider = "age", description = "Production sender email" }
